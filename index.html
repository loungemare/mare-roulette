<section class="screen game" id="game"><main class="page"><div class="game-top"><div class="eyebrow">MARE ROULETTE</div><button class="secondary" id="back">⚙ 参加者設定</button></div><div class="game-layout"><div class="wheel-area"><div class="wheel-rim"></div><svg aria-label="参加者のルーレット" class="wheel-svg" id="wheel" role="img" viewbox="0 0 400 400"></svg><div class="pointer"></div><div class="hub"></div></div><div class="game-controls"><div class="result" id="result"></div><button class="primary" id="spin">START — 抽選する</button><button class="secondary hidden" id="again">もう一度</button><div class="game-caption"></div></div></div></main></section>
<section class="screen final-screen" id="finalResult"><div class="final-inner"><div class="final-overline">MARE ROULETTE</div><div class="final-rule"></div><div class="final-done">DONE.</div><div class="final-sub">THE LUCKY ONES</div><div class="final-names" id="finalNames"></div><div class="final-rule short"></div><div class="final-note"></div><button class="primary" id="finalAgain">もう一度回す</button><button class="secondary" id="finalSetup">参加者設定</button></div></section><script>
const $=id=>document.getElementById(id), KEY='mare_roulette_players_v2';
let players;try{players=JSON.parse(localStorage.getItem(KEY))}catch{}
if(!Array.isArray(players)||players.length<2)players=['参加者1','参加者2'];
players=players.slice(0,10).map(x=>String(x).slice(0,16));
let multi=false,winCount=2,spinning=false,winners=[],active=-1,animationToken=0;
const NS='http://www.w3.org/2000/svg';
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id))}
setTimeout(()=>show('setup'),5000);
function save(){try{localStorage.setItem(KEY,JSON.stringify(players))}catch{}}
function renderPlayers(){const wrap=$('players');wrap.replaceChildren();players.forEach((p,i)=>{const row=document.createElement('div');row.className='player';const inp=document.createElement('input');inp.value=p;inp.maxLength=16;inp.setAttribute('aria-label',`参加者${i+1}`);inp.addEventListener('input',()=>{players[i]=inp.value;save()});const del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label',`${p}を削除`);del.disabled=players.length<=2;del.onclick=()=>{players.splice(i,1);save();renderPlayers()};row.append(inp,del);wrap.append(row)});$('playerCount').textContent=`${players.length} / 10`;$('add').disabled=players.length>=10;winCount=Math.min(winCount,players.length);$('winCount').replaceChildren();for(let n=2;n<=players.length;n++){const o=document.createElement('option');o.value=n;o.textContent=n+'人';$('winCount').append(o)}$('winCount').value=Math.max(2,winCount)}
$('add').onclick=()=>{if(players.length>=10)return;players.push('参加者'+(players.length+1));save();renderPlayers()};
function renderMode(){$('single').classList.toggle('selected',!multi);$('multiple').classList.toggle('selected',multi);$('countrow').hidden=!multi}
$('single').onclick=()=>{multi=false;renderMode()};$('multiple').onclick=()=>{multi=true;renderMode()};$('winCount').onchange=e=>winCount=Number(e.target.value);renderMode();renderPlayers();
function element(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);parent.append(e);return e}
function point(a,r){return [200+r*Math.cos(a),200+r*Math.sin(a)]}
function wheelDraw(){const svg=$('wheel');svg.replaceChildren();const n=players.length,step=2*Math.PI/n;
for(let i=0;i<n;i++){
 const a=-Math.PI/2+i*step,b=a+step,p1=point(a,192),p2=point(b,192);
 const path=`M 200 200 L ${p1.join(' ')} A 192 192 0 ${step>Math.PI?1:0} 1 ${p2.join(' ')} Z`;
 const sector=element('path',{d:path,fill:i%2?'#202124':'#111214',stroke:'#a88b51','stroke-width':1.8,'data-index':i,class:'sector'+(active===i?' active-light':'')},svg);
 const mid=a+step/2,[x,y]=point(mid,n>=8?135:124);
 const label=players[i];const fontSize=n>=9?15:n>=7?17:label.length>7?16:21;
 const text=element('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle',fill:'#ffffff','font-size':fontSize,'font-weight':'700',class:'wheel-label'},svg);
 // Keep every name horizontal and upright, irrespective of its position on the wheel.
 text.textContent=label;
}
element('circle',{cx:200,cy:200,r:191,fill:'none',stroke:'#e7c57d','stroke-width':4},svg);
}
function light(index){if(active===index)return;active=index;document.querySelectorAll('#wheel .sector').forEach((el,i)=>el.classList.toggle('active-light',i===index))}
function randomInt(max){if(max<=1)return 0;const arr=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;let x;do{if(globalThis.crypto?.getRandomValues)crypto.getRandomValues(arr);else arr[0]=Math.floor(Math.random()*4294967296);x=arr[0]}while(x>=limit);return x%max}
function sample(n,k){const a=Array.from({length:n},(_,i)=>i);for(let i=0;i<k;i++){const j=i+randomInt(n-i);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k)}
function reset(){animationToken++;spinning=false;winners=[];active=-1;wheelDraw();$('result').textContent='';$('again').classList.add('hidden');$('spin').classList.remove('hidden');$('spin').disabled=false;$('back').disabled=false}
$('toGame').onclick=()=>{players=players.map((x,i)=>x.trim()||`参加者${i+1}`);save();reset();show('game')};
$('back').onclick=()=>{if(spinning)return;show('setup');renderPlayers()};
$('again').onclick=reset;
$('spin').onclick=()=>{
 if(spinning)return;spinning=true;$('spin').disabled=true;$('back').disabled=true;winners=[];active=-1;wheelDraw();$('result').textContent='';
 const n=players.length,k=multi?Math.min(winCount,n):1,selected=sample(n,k),duration=8000+randomInt(2001);
 // The selection is uniformly random without replacement. The light is visual only.
 // Slow chase effect: no rapidly rotating text or wheel.
 const token=++animationToken,start=performance.now(),totalSteps=Math.max(n*3,Math.round(duration/270));
 let lastStep=-1,position=randomInt(n);
 function frame(now){if(token!==animationToken)return;const t=Math.min(1,(now-start)/duration);
  const eased=1-Math.pow(1-t,1.8),step=Math.min(totalSteps-1,Math.floor(eased*totalSteps));
  if(step!==lastStep){position=(position+Math.max(1,step-lastStep))%n;lastStep=step;light(position)}
  if(t<1){requestAnimationFrame(frame);return}
  active=-1;winners=selected;wheelDraw();spinning=false;
  $('result').textContent='';
  const finalNames=$('finalNames');finalNames.replaceChildren();selected.forEach(i=>{const e=document.createElement('div');e.className='final-name';e.textContent=players[i];finalNames.append(e)});
  $('spin').classList.add('hidden');$('again').classList.remove('hidden');$('spin').disabled=false;$('back').disabled=false;
  if(navigator.vibrate)navigator.vibrate([160,70,240]);show('finalResult')
 }
 requestAnimationFrame(frame)
};
$('finalAgain').onclick=()=>{reset();show('game')};$('finalSetup').onclick=()=>{reset();show('setup');renderPlayers()};
</script></body></html>
